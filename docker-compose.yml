services:
  postgis:
    build:
      context: .
      dockerfile: test/docker/Dockerfile.gis
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-os}
      POSTGRES_USER: ${DATABASE_USER:-bats}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-bats}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-bats} -d ${DATABASE_NAME:-os}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  api:
    build:
      dockerfile: test/docker/Dockerfile.backend
    ports:
      - "8000:8000"
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      DB_HOST: postgis
      DB_NAME: ${DATABASE_NAME:-os}
      DB_PORT: 5432
      DB_USER: ${DATABASE_USER:-bats}
      DB_PASSWORD: ${DATABASE_PASSWORD:-bats}
      DATABASE_HOST: postgis
      DATABASE_NAME: ${DATABASE_NAME:-os}
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-bats}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-bats}
      CORS_ORIGINS: http://localhost:5180,http://localhost:5173,http://localhost:4173
    volumes:
      - ./data/seed:/seed

  frontend:
    build:
      dockerfile: test/docker/Dockerfile.frontend
      additional_contexts:
        gsbio: ../gsbio-engine
    ports:
      - "5180:5180"
    depends_on:
      - api
    environment:
      VITE_PROXY_API: http://api:8000

volumes:
  pgdata:
