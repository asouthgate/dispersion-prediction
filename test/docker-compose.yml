version: "3.8"

services:
  postgis:
    image: postgis/postgis:13-3.1
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-os}
      POSTGRES_USER: ${DATABASE_USER:-bats}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-bats}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./test/data/seed/sql:/docker-entrypoint-initdb.d
      - ./test/data/seed:/seed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-bats} -d ${DATABASE_NAME:-os}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  batapp:
    build:
      context: ..
      dockerfile: test/docker/Dockerfile
    ports:
      - "3838:3838"
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      DATABASE_HOST: postgis
      DATABASE_NAME: ${DATABASE_NAME:-os}
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-bats}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-bats}
    volumes:
      - ./test/data/seed:/seed

volumes:
  pgdata: