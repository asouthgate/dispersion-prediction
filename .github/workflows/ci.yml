name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  r-tests:
    runs-on: ubuntu-22.04

    env:
      RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/jammy/latest
      RSPM: https://packagemanager.posit.co/cran/__linux__/jammy/latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgeos-dev \
            libgdal-dev \
            libproj-dev \
            libudunits2-dev \
            libcurl4-gnutls-dev \
            libssl-dev \
            libxml2-dev \
            libpq-dev

      - name: Install renv and restore packages
        run: |
          RENV_PATHS_ROOT=${{ runner.temp }}/renv
          echo "RENV_PATHS_ROOT=$RENV_PATHS_ROOT" >> $GITHUB_ENV
          Rscript -e "options(repos = c(CRAN = '${{ env.RENV_CONFIG_REPOS_OVERRIDE }}')); if (!requireNamespace('renv', quietly = TRUE)) install.packages('renv'); renv::restore()"

      - name: Run R unit tests
        run: Rscript test/run_unit_tests.R

  api-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_DB: os
          POSTGRES_USER: bats
          POSTGRES_PASSWORD: bats
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bats -d os"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 15s

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install pytest fakeredis

      - name: Create .bats.cfg from template
        run: envsubst < test/docker/batapp/bats.cfg.template > ~/.bats.cfg
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: os
          DATABASE_USER: bats
          DATABASE_PASSWORD: bats

      - name: Run API tests
        run: pytest api/test/ -v
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: os
          DB_USER: bats
          DB_PASSWORD: bats
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: os
          DATABASE_USER: bats
          DATABASE_PASSWORD: bats
          CELERY_BROKER_URL: memory://
          CELERY_RESULT_BACKEND: cache+memory://
          PIPELINE_WORK_DIR: /tmp/circuitscape-test

  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: test/docker/Dockerfile.backend
          tags: dispersion-prediction-app-api
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build frontend image (cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: test/docker/Dockerfile.frontend
          build-contexts: gsbio=gsbio-engine
          tags: dispersion-prediction-app-frontend
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Build postgis image (cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: test/docker/Dockerfile.gis
          tags: dispersion-prediction-app-postgis
          load: true
          cache-from: type=gha,scope=postgis
          cache-to: type=gha,scope=postgis,mode=max

  integration-tests:
    runs-on: ubuntu-latest
    needs: [build-images]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore API image from cache
        uses: docker/build-push-action@v5
        with:
          context: .
          file: test/docker/Dockerfile.backend
          tags: dispersion-prediction-app-api
          load: true
          cache-from: type=gha,scope=api

      - name: Restore frontend image from cache
        uses: docker/build-push-action@v5
        with:
          context: .
          file: test/docker/Dockerfile.frontend
          build-contexts: gsbio=gsbio-engine
          tags: dispersion-prediction-app-frontend
          load: true
          cache-from: type=gha,scope=frontend

      - name: Restore postgis image from cache
        uses: docker/build-push-action@v5
        with:
          context: .
          file: test/docker/Dockerfile.gis
          tags: dispersion-prediction-app-postgis
          load: true
          cache-from: type=gha,scope=postgis

      - name: Create .env from example
        run: cp .env.example .env

      - name: Create .bats.cfg from template
        run: envsubst < test/docker/batapp/bats.cfg.template > ~/.bats.cfg
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: os
          DATABASE_USER: bats
          DATABASE_PASSWORD: bats

      - name: Run Docker API integration tests
        run: SKIP_BUILD=true bash run-docker-api-test.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-results
          path: tmp/api-output/
          retention-days: 7
