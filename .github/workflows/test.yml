name: Unit Tests

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  unit-tests:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgeos-dev \
            libgdal-dev \
            libproj-dev \
            libudunits2-dev \
            libcurl4-gnutls-dev \
            libssl-dev \
            libxml2-dev \
            libpq-dev

      - uses: r-lib/actions/setup-renv@v2

      - name: Run unit tests
        run: Rscript test/run_unit_tests.R