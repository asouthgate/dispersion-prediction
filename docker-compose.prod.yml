x-app-environment: &app-environment
  CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
  DATABASE_HOST: ${DATABASE_HOST:?DATABASE_HOST must be set}
  DATABASE_NAME: ${DATABASE_NAME:?DATABASE_NAME must be set}
  DATABASE_PORT: ${DATABASE_PORT:?DATABASE_PORT must be set}
  DATABASE_USER: ${DATABASE_USER:?DATABASE_USER must be set}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:?CELERY_BROKER_URL must be set}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:?CELERY_RESULT_BACKEND must be set}
  AUTH_REDIS_URL: ${AUTH_REDIS_URL:?AUTH_REDIS_URL must be set}
  PIPELINE_WORK_DIR: ${PIPELINE_WORK_DIR:-/tmp/circuitscape}
  PIPELINE_WORK_DIR_TTL_HOURS: ${PIPELINE_WORK_DIR_TTL_HOURS:-24}
  PIPELINE_TIMEOUT: ${PIPELINE_TIMEOUT:-1800}
  PMTILES_DIR: ${PMTILES_DIR:-/data/pmtiles}
  UMAMI_URL: ${UMAMI_URL:?UMAMI_URL must be set}
  UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
  UMAMI_ADMIN_USER: ${UMAMI_ADMIN_USER:-admin}
  UMAMI_ADMIN_PASSWORD: ${UMAMI_ADMIN_PASSWORD:-umami}
  ANALYTICS_HASH_SECRET: ${ANALYTICS_HASH_SECRET:?ANALYTICS_HASH_SECRET must be set}

x-app-defaults: &app-defaults
  image: dispersion-prediction-app-api:v1.0.0
  restart: always
  network_mode: host
  volumes:
    - pipeline_work:/tmp/circuitscape
    - /opt/dispersion-app/data/uk-global-base.pmtiles:/data/pmtiles/uk.pmtiles:ro
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"

services:
  redis:
    image: redis:7-alpine
    restart: always
    network_mode: host
    command: redis-server --port ${REDIS_PORT:?REDIS_PORT must be set}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT:?REDIS_PORT must be set}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  api:
    <<: *app-defaults
    environment:
      <<: *app-environment
      API_PORT: ${API_PORT:?API_PORT must be set}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${API_PORT:-8084}/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  celery_worker:
    <<: *app-defaults
    environment:
      <<: *app-environment
    working_dir: /app/api
    command: celery -A celery_app worker -B --loglevel=info --concurrency=${PIPELINE_MAX_WORKERS:-4}
    healthcheck:
      test: ["CMD", "celery", "-A", "celery_app", "inspect", "ping", "-d", "celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 512M

  umami:
    image: docker.umami.is/umami-software/umami:postgresql-latest
    restart: always
    network_mode: host
    environment:
      DATABASE_URL: postgresql://${DATABASE_USER:?DATABASE_USER must be set}:${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}@${DATABASE_HOST:?DATABASE_HOST must be set}:${DATABASE_PORT:?DATABASE_PORT must be set}/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?UMAMI_APP_SECRET must be set}
      DISABLE_TELEMETRY: "1"
      PORT: ${UMAMI_PORT:?UMAMI_PORT must be set}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${UMAMI_PORT:-3084}/api/heartbeat || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  redisdata:
  pipeline_work:
