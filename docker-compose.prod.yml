x-app-defaults: &app-defaults
  image: dispersion-prediction-app-api:v1.0.0
  restart: always
  environment:
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    DATABASE_HOST: ${DATABASE_HOST:-localhost}
    DATABASE_NAME: ${DATABASE_NAME:-os}
    DATABASE_PORT: ${DATABASE_PORT:-5432}
    DATABASE_USER: ${DATABASE_USER:-bats}
    DATABASE_PASSWORD: ${DATABASE_PASSWORD:-bats}
    CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
    CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    AUTH_REDIS_URL: ${AUTH_REDIS_URL:-redis://redis:6379/2}
    PIPELINE_WORK_DIR: /tmp/circuitscape
    PIPELINE_WORK_DIR_TTL_HOURS: ${PIPELINE_WORK_DIR_TTL_HOURS:-24}
    PIPELINE_TIMEOUT: ${PIPELINE_TIMEOUT:-1800}
    PMTILES_DIR: /data/pmtiles
    UMAMI_URL: ${UMAMI_URL:-http://umami:3000}
    UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    UMAMI_ADMIN_USER: ${UMAMI_ADMIN_USER:-admin}
    UMAMI_ADMIN_PASSWORD: ${UMAMI_ADMIN_PASSWORD:-umami}
    ANALYTICS_HASH_SECRET: ${ANALYTICS_HASH_SECRET:-change-me-in-production}
  volumes:
    - pipeline_work:/tmp/circuitscape
    # Ensure this host path exists and contains the required .pmtiles files.
    - /opt/dispersion-app/data/pmtiles:/data/pmtiles:ro
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"

services:
  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  api:
    <<: *app-defaults
    environment:
      <<: *app-defaults.environment
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  celery_worker:
    <<: *app-defaults
    environment:
      <<: *app-defaults.environment
      PIPELINE_MAX_WORKERS: ${PIPELINE_MAX_WORKERS:-4}
    working_dir: /app/api
    command: celery -A celery_app worker -B --loglevel=info --concurrency=${PIPELINE_MAX_WORKERS:-4}
    healthcheck:
      test: ["CMD", "celery", "-A", "celery_app", "inspect", "ping", "-d", "celery@$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 512M

  umami:
    image: docker.umami.is/umami-software/umami:postgresql-latest
    restart: always
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      DATABASE_URL: postgresql://${DATABASE_USER:-bats}:${DATABASE_PASSWORD:-bats}@${DATABASE_HOST:-localhost}:${DATABASE_PORT:-5432}/${DATABASE_NAME:-umami}
      APP_SECRET: ${UMAMI_APP_SECRET:-change-me-in-production}
      DISABLE_TELEMETRY: "1"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/heartbeat || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  redisdata:
  pipeline_work:
